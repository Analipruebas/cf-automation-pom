name: Pruebas unitarias en PythonAni
run-name: Pruebas UnitariasAni
on: [push]
jobs:
  python-unit-testsAni:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Crear variable
        run: echo "USERNAME=${{github.actor}}" >> $GITHUB_ENV
      - name: Ejecutar script de Python
        run: python hola_gha.py